name: astrbot_plugin_guardian
display_name: 机器人守护管家
desc: QQ机器人守护系统管理插件：自动部署/拉起进程外守护循环（Docker引擎/napcat容器/AstrBot自愈），提供 /守护 指令查状态、重启容器、出新码、发二维码
help: |
  /守护          查看守护状态摘要
  /守护 部署      释放内置守护脚本并拉起常驻循环 + 写开机自启
  /守护 重启容器   重启 napcat 容器
  /守护 重启守护   杀掉守护循环并重新拉起
  /守护 日志      查看守护日志最后若干行
  /守护 二维码     提取容器当前二维码图片发到会话
  /守护 新码      停容器-清登录数据-重启出新码（恢复扫码登录）
version: v1.0.0
author: 摆烂的四不相
repo: ""
astrbot_version: ">=4.24.4"
